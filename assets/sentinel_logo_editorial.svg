<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 20 820 190" width="1640" height="380" role="img" aria-label="Sentinel Swiss Editorial Wordmark">
<defs>
  <radialGradient id="orbBody" cx=".35" cy=".28" r=".95">
    <stop offset="0" stop-color="#d9fbff"/><stop offset=".38" stop-color="#3fc4f2"/><stop offset=".78" stop-color="#0b7fd0"/><stop offset="1" stop-color="#0a4f9e"/>
  </radialGradient>
  <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#9deaff" stop-opacity=".6"/><stop offset="1" stop-color="#0f766e"/>
  </linearGradient>
  <linearGradient id="crossGlass" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#c4eeff"/><stop offset="1" stop-color="#74c9f0"/>
  </linearGradient>
  <radialGradient id="limeGem" cx=".38" cy=".3" r=".8">
    <stop offset="0" stop-color="#f9ffc2"/><stop offset=".45" stop-color="#a6e82c"/><stop offset="1" stop-color="#2f9a1c"/>
  </radialGradient>
  <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity=".05"/>
  </linearGradient>
</defs>

<!-- Compact Emblem Scaled Cleanly for White Paper / Document Mastheads -->
<g transform="translate(18, 22) scale(0.46)">
  <circle cx="200" cy="205" r="148" fill="url(#orbBody)"/>
  <circle cx="200" cy="205" r="148" fill="none" stroke="url(#rim)" stroke-width="6"/>
  <rect x="125" y="181" width="150" height="48" rx="18" fill="url(#crossGlass)" stroke="#fff" stroke-width="3"/>
  <rect x="176" y="130" width="48" height="150" rx="18" fill="url(#crossGlass)" stroke="#fff" stroke-width="3"/>
  <rect x="176" y="183" width="48" height="44" fill="url(#crossGlass)"/>
  <circle cx="200" cy="205" r="28" fill="url(#limeGem)" stroke="#fff" stroke-width="3.5"/>
  <path d="M62 188 C 70 100, 140 62, 200 62 C 260 62, 330 100, 338 188 C 290 146, 110 146, 62 188Z" fill="url(#gloss)"/>
  <g fill="none" stroke="#0f172a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity="0.25">
    <path d="M40 85 V45 H80"/><path d="M320 45 H360 V85"/><path d="M360 325 V365 H320"/><path d="M80 365 H40 V325"/>
  </g>
</g>

<!-- Clean Swiss Editorial Typography for White Paper Headers -->
<text x="214" y="106" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="700" letter-spacing="3" fill="#0F172A">SENTINEL</text>
<line x1="216" y1="122" x2="785" y2="122" stroke="#0F766E" stroke-width="2.5"/>
<text x="216" y="152" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2.4" fill="#0F766E">MEDTECH · PRIVACY · REGULATORY COMPLIANCE SUITE</text>
</svg>