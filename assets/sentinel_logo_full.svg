<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 10 960 390" width="1920" height="780" role="img" aria-label="Sentinel Full Logo Lockup">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1f93e0"/><stop offset=".45" stop-color="#6ccaf5"/><stop offset="1" stop-color="#e6f9ff"/>
  </linearGradient>
  <radialGradient id="sun" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset=".35" stop-color="#fffbd0" stop-opacity=".6"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="orbBody" cx=".35" cy=".28" r=".95">
    <stop offset="0" stop-color="#d9fbff"/><stop offset=".38" stop-color="#3fc4f2"/><stop offset=".78" stop-color="#0b7fd0"/><stop offset="1" stop-color="#0a4f9e"/>
  </radialGradient>
  <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#9deaff" stop-opacity=".5"/><stop offset="1" stop-color="#b6ff6a"/>
  </linearGradient>
  <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity=".05"/>
  </linearGradient>
  <linearGradient id="crossGlass" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#c4eeff"/><stop offset="1" stop-color="#74c9f0"/>
  </linearGradient>
  <radialGradient id="limeGem" cx=".38" cy=".3" r=".8">
    <stop offset="0" stop-color="#f9ffc2"/><stop offset=".45" stop-color="#a6e82c"/><stop offset="1" stop-color="#2f9a1c"/>
  </radialGradient>
  <linearGradient id="hillBack" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b4ee74"/><stop offset="1" stop-color="#3cae42"/></linearGradient>
  <linearGradient id="hillFront" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fdc4e"/><stop offset="1" stop-color="#1f8a34"/></linearGradient>
  <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d6ff7d"/><stop offset="1" stop-color="#27a02f"/></linearGradient>
  <linearGradient id="swoosh" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#b8ff5c" stop-opacity="0"/><stop offset=".3" stop-color="#b8ff5c" stop-opacity=".95"/><stop offset=".7" stop-color="#7ae6ff" stop-opacity=".95"/><stop offset="1" stop-color="#7ae6ff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="wordGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0a4f9e"/><stop offset=".55" stop-color="#0f86d8"/><stop offset="1" stop-color="#27b8ee"/>
  </linearGradient>
  <linearGradient id="pill" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#c2f56a"/><stop offset=".5" stop-color="#6fd02f"/><stop offset="1" stop-color="#2f9e24"/>
  </linearGradient>
  <radialGradient id="bubble" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#fff" stop-opacity=".04"/><stop offset=".72" stop-color="#cdf4ff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity=".9"/>
  </radialGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
    <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#04447a" flood-opacity=".45"/>
  </filter>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#04447a" flood-opacity=".5"/>
  </filter>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
  <filter id="blurSm" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
  <clipPath id="topHalf"><rect x="380" y="95" width="540" height="72"/></clipPath>
  <clipPath id="cardClip"><rect x="12" y="18" width="936" height="374" rx="28"/></clipPath>
</defs>

<!-- Frutiger-Aero Sky & Horizon Banner Frame -->
<g clip-path="url(#cardClip)">
  <rect x="12" y="18" width="936" height="374" fill="url(#sky)"/>
  <circle cx="760" cy="86" r="175" fill="url(#sun)"/>
  <!-- Rolling Eco Hills -->
  <path d="M12 315 Q 240 245, 520 305 T 948 265 L 948 395 L 12 395 Z" fill="url(#hillBack)" opacity="0.65"/>
  <path d="M12 342 Q 310 290, 620 335 T 948 308 L 948 395 L 12 395 Z" fill="url(#hillFront)" opacity="0.82"/>
  <!-- Luminous Flowing Swoosh Connecting Orb to Wordmark -->
  <path d="M295 258 C 430 315, 650 302, 885 210 C 675 268, 455 276, 305 224 Z" fill="url(#swoosh)" opacity="0.85" filter="url(#blurSm)"/>
  <path d="M295 254 C 430 308, 650 296, 885 206" fill="none" stroke="#fff" stroke-width="2.5" opacity="0.75"/>
</g>
<rect x="12" y="18" width="936" height="374" rx="28" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="3"/>

<!-- Left Emblem (Original Sentinel Mark Elements) -->
<g transform="translate(250 372) rotate(-20) scale(0.6)" filter="url(#softShadow)"><path d="M0 0 C 30 -46, 86 -48, 110 -12 C 80 24, 22 30, 0 0Z" fill="url(#leaf)" stroke="#e9ffc4" stroke-width="2"/><path d="M4 -2 C 40 -14, 70 -18, 104 -12" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="2"/><path d="M18 -26 C 40 -34, 66 -36, 92 -26 C 60 -30, 40 -24, 18 -26Z" fill="#fff" opacity=".35"/></g>
<g transform="translate(150 376) rotate(-160) scale(0.55)" filter="url(#softShadow)"><path d="M0 0 C 30 -46, 86 -48, 110 -12 C 80 24, 22 30, 0 0Z" fill="url(#leaf)" stroke="#e9ffc4" stroke-width="2"/><path d="M4 -2 C 40 -14, 70 -18, 104 -12" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="2"/><path d="M18 -26 C 40 -34, 66 -36, 92 -26 C 60 -30, 40 -24, 18 -26Z" fill="#fff" opacity=".35"/></g>

<g id="badge">
  <circle cx="200" cy="205" r="164" fill="#fff" opacity=".28"/>
  <circle cx="200" cy="205" r="158" fill="none" stroke="#fff" stroke-width="3" opacity=".9"/>
  <circle cx="200" cy="205" r="148" fill="url(#orbBody)" filter="url(#shadow)"/>
  <circle cx="200" cy="205" r="148" fill="none" stroke="url(#rim)" stroke-width="5"/>
  <circle cx="200" cy="205" r="122" fill="none" stroke="#fff" stroke-width="2.5" opacity=".5" stroke-dasharray="1 9" stroke-linecap="round"/>
  <ellipse cx="200" cy="330" rx="98" ry="26" fill="#9af0ff" opacity=".5" filter="url(#blurSm)"/>
  <g filter="url(#shadow)">
    <rect x="125" y="181" width="150" height="48" rx="18" fill="url(#crossGlass)" stroke="#fff" stroke-width="3"/>
    <rect x="176" y="130" width="48" height="150" rx="18" fill="url(#crossGlass)" stroke="#fff" stroke-width="3"/>
    <rect x="176" y="183" width="48" height="44" fill="url(#crossGlass)"/>
  </g>
  <rect x="134" y="186" width="132" height="14" rx="7" fill="#fff" opacity=".6"/>
  <rect x="181" y="136" width="14" height="40" rx="7" fill="#fff" opacity=".6"/>
  <g filter="url(#softShadow)">
    <circle cx="200" cy="205" r="28" fill="url(#limeGem)" stroke="#fff" stroke-width="3.5"/>
  </g>
  <ellipse cx="191" cy="194" rx="12" ry="7" fill="#fff" opacity=".85" transform="rotate(-30 191 194)"/>
  <path d="M62 188 C 70 100, 140 62, 200 62 C 260 62, 330 100, 338 188 C 290 146, 110 146, 62 188Z" fill="url(#gloss)"/>
  <g fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" filter="url(#softShadow)">
    <path d="M40 85 V45 H80"/><path d="M320 45 H360 V85"/><path d="M360 325 V365 H320"/><path d="M80 365 H40 V325"/>
  </g>
  <g fill="none" stroke="#7ae6ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M40 85 V45 H80"/><path d="M320 45 H360 V85"/><path d="M360 325 V365 H320"/><path d="M80 365 H40 V325"/>
  </g>
</g>

<!-- Floating Bubbles & Stars -->
<g><circle cx="34" cy="84" r="18" fill="url(#bubble)" stroke="#fff" stroke-opacity=".7" stroke-width="1.5"/><ellipse cx="28.2" cy="76.8" rx="5.0" ry="2.7" fill="#fff" opacity=".85" transform="rotate(-30 28.2 76.8)"/></g>
<g><circle cx="372" cy="120" r="22" fill="url(#bubble)" stroke="#fff" stroke-opacity=".7" stroke-width="1.5"/><ellipse cx="365.0" cy="111.2" rx="6.2" ry="3.3" fill="#fff" opacity=".85" transform="rotate(-30 365.0 111.2)"/></g>
<g><circle cx="370" cy="300" r="14" fill="url(#bubble)" stroke="#fff" stroke-opacity=".7" stroke-width="1.5"/><ellipse cx="365.5" cy="294.4" rx="3.9" ry="2.1" fill="#fff" opacity=".85" transform="rotate(-30 365.5 294.4)"/></g>
<g><circle cx="46" cy="330" r="12" fill="url(#bubble)" stroke="#fff" stroke-opacity=".7" stroke-width="1.5"/><ellipse cx="42.2" cy="325.2" rx="3.4" ry="1.8" fill="#fff" opacity=".85" transform="rotate(-30 42.2 325.2)"/></g>
<g><circle cx="888" cy="96" r="16" fill="url(#bubble)" stroke="#fff" stroke-opacity=".7" stroke-width="1.5"/><ellipse cx="882.8" cy="90" rx="4.5" ry="2.4" fill="#fff" opacity=".85" transform="rotate(-30 882.8 90)"/></g>
<path d="M0 -14 L3 -3 L14 0 L3 3 L0 14 L-3 3 L-14 0 L-3 -3Z" fill="#fff" opacity="0.95" transform="translate(90 50) scale(1.0)"/>
<path d="M0 -14 L3 -3 L14 0 L3 3 L0 14 L-3 3 L-14 0 L-3 -3Z" fill="#fff" opacity="0.95" transform="translate(344 56) scale(0.8)"/>
<path d="M0 -14 L3 -3 L14 0 L3 3 L0 14 L-3 3 L-14 0 L-3 -3Z" fill="#fff" opacity="0.95" transform="translate(866 154) scale(0.75)"/>

<!-- Right Wordmark + Gloss Top Highlight + Aero Green Pill -->
<g filter="url(#softShadow)">
  <text x="404" y="196" font-family="'Segoe UI', 'Frutiger', 'Trebuchet MS', Arial, sans-serif" font-size="86" font-weight="800" letter-spacing="4" fill="#ffffff" stroke="#ffffff" stroke-width="7" stroke-linejoin="round">SENTINEL</text>
  <text x="404" y="196" font-family="'Segoe UI', 'Frutiger', 'Trebuchet MS', Arial, sans-serif" font-size="86" font-weight="800" letter-spacing="4" fill="url(#wordGrad)">SENTINEL</text>
  <text x="404" y="196" font-family="'Segoe UI', 'Frutiger', 'Trebuchet MS', Arial, sans-serif" font-size="86" font-weight="800" letter-spacing="4" fill="#ffffff" opacity="0.48" clip-path="url(#topHalf)">SENTINEL</text>
</g>

<!-- Glass Subtitle Pill -->
<g filter="url(#softShadow)">
  <rect x="408" y="220" width="468" height="44" rx="22" fill="url(#pill)" stroke="#ffffff" stroke-width="2.5"/>
  <rect x="416" y="224" width="452" height="17" rx="9" fill="#ffffff" opacity="0.42"/>
  <text x="642" y="248" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2.2" fill="#ffffff">MEDTECH · PRIVACY · REGULATORY SUITE</text>
</g>

<!-- Swiss Trust Sub-caption (Centered Under Pill with Clean Contrast) -->
<rect x="408" y="274" width="468" height="28" rx="14" fill="#ffffff" fill-opacity="0.72"/>
<text x="642" y="293" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="700" letter-spacing="0.4" fill="#064e88">
  25-Control Audit · PRISMA 2020 · OpenFDA PSUR · RA Command
</text>
</svg>